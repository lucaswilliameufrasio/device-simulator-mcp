name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: git-cliff@2.13.1
      - name: Validate version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git cliff --bump --tag "v$VERSION" -o CHANGELOG.md
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo generate-lockfile
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare for v$VERSION"
          BRANCH="release/v$VERSION-rc.${{ github.run_attempt }}"
          git push --force-with-lease origin HEAD:"$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body "Automated release preparation for v$VERSION."
