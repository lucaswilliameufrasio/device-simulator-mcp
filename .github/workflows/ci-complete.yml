name: Complete CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

  docs:
    name: Landing page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e-ios:
    name: iOS E2E
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install pinned serve-sim helper
        run: |
          npm install --global serve-sim@0.1.47
          echo "SERVE_SIM_BINARY=$(command -v serve-sim)" >> "$GITHUB_ENV"
      - run: cargo build --locked --release
      - name: Boot iOS Simulator
        run: |
          device_id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ { print $2; exit }')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          echo "IOS_SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"
      - name: Run iOS E2E
        env:
          DEVICE_PLATFORM: ios
          RUST_LOG: device_simulator_mcp=debug
        run: bash tests/e2e.sh target/release/device-simulator-mcp
      - name: Collect serve-sim startup log
        if: failure()
        run: |
          log_dir="$(node -p 'require("node:os").tmpdir()')/serve-sim"
          log_file="$log_dir/server-${IOS_SIMULATOR_UDID}.log"
          if [ -f "$log_file" ]; then
            log_bytes=$(wc -c < "$log_file")
            echo "serve-sim startup log: $log_file ($log_bytes bytes)"
            if [ "$log_bytes" -gt 0 ]; then
              tail -n 80 "$log_file"
            else
              echo "The serve-sim startup log is empty."
            fi
          else
            echo "No serve-sim startup log found in $log_dir."
            find "$log_dir" -maxdepth 1 -type f -name 'server-*.log' -print 2>/dev/null || true
          fi

  e2e-android:
    name: Android E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo build --locked --release
      - name: Boot Android Emulator
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          script: bash tests/e2e.sh target/release/device-simulator-mcp
        env:
          DEVICE_PLATFORM: android
          ANDROID_SERIAL: emulator-5554
