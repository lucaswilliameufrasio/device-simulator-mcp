[package]
name = "device-simulator-mcp"
version = "0.1.5"
edition = "2024"
repository = "https://github.com/lucaswilliameufrasio/device-simulator-mcp"
authors = ["Lucas Eufrasio"]
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jsonc-parser = { version = "0.33.2", features = ["cst"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
